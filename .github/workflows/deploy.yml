name: Deploy MeteoHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# ⚠️ workflow 级 permissions **只留 contents: read**（D100）。
#
# 为什么收窄：`pages: write` 与 `id-token: write` 原先挂在 workflow 级 ⇒
# **每一个 job 都持有**，包括跑完整条 build 链的 build job（它会执行
# `npm ci` 与仓内 100+ 步门禁脚本 = 仓里可被改的代码）。
#   · `id-token: write` 的危害最大：它让那个 job 能**铸造 OIDC JWT**，
#     而 OIDC 令牌正是「以本仓库身份去第三方云（AWS/GCP/Azure）换凭据」
#     的那张凭证 —— 拿到它的 job 可以拿着仓库的身份去别处取密钥。
#   · `pages: write` 让持有者能**创建 Pages 部署**（改线上内容）。
# 官方 deploy-pages 的 action.yml 写明：执行部署的 job **至少**需要
# `pages: write` + `id-token: write` —— 这两个权限本来就只需要在 deploy
# job 上（https://github.com/actions/deploy-pages#deploy-pages）。
#   · build job 只保留 `contents: read` + `pages: read`：
#     `actions/configure-pages` 只调 `repos.getPages`（GET /repos/{o}/{r}/pages）
#     取站点元数据，实测 dist 里的接口只有 GET，没有写操作 ⇒ `pages: read` 足够。
#   · verify-live job 只需要读代码 ⇒ `contents: read`。
permissions:
  contents: read

# 同一 group 只允许一个 deploy 运行，避免并发部署
concurrency:
  group: pages
  # ⚠️ **不取消在途的部署**（D104）。
  # 原先这里是 true：新推送一到，**正在跑的那次生产部署会被当场杀掉**。
  # 被杀的那次是**半途而废**（artifact 可能已经传上去、部署却没走完），
  # 站点会停在旧版本或不一致的中间态，而且这次 run 在 GitHub 上显示为
  # **cancelled 而不是 failed** —— 没有失败告警，最难发现。
  # 官方 Pages 静态站点模板写的就是 false，注释明写：
  #   "do NOT cancel in-progress runs as we want to allow these production
  #    deployments to complete"
  #   (https://github.com/actions/starter-workflows/blob/main/pages/static.yml)
  # false 仍然保证「同一 group 同一时刻只有一个在跑、pending 只留最新一个」，
  # 所以**并发部署照样不会发生** —— 变的只是不再杀在途。
  # ⚠️ 代价是「在途」可以一直占着 group ⇒ 必须靠下面每个 job 的
  #    `timeout-minutes` 兜底，否则一次挂死的部署能把整个发布管线堵死 6 小时
  #    （GitHub 的默认上限），期间的推送全被折叠成唯一一个 pending。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 挂死兜底：GitHub 的 job 默认上限是 **360 分钟**（6 小时），一次卡住的
    # build 能把整个 concurrency group 占住 6 小时（见上面 cancel-in-progress
    # 那段注释）。本仓 build 链实测约 4~5 分钟 ⇒ 30 分钟是宽裕的余量。
    timeout-minutes: 30
    # build job 只读代码 + 读 Pages 站点元数据，不写任何东西（D100）。
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        # ⚠️ pin 到 commit SHA（不是 tag）—— 见文件末尾「action 版本钉法」。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # ⚠️ 不把 token 留在 .git/config 里（persist-credentials 默认 true ⇒
          # checkout 会把 GITHUB_TOKEN 写进本地 git 配置，仓内任何脚本都能用它）。
          # 本仓的 build 链只用**本地** git 读历史（git log / git rev-parse），
          # 不做任何需要鉴权的远端操作 ⇒ 关掉零影响。
          persist-credentials: false
          # sitemap 的 <lastmod> 取"该页源文件最后一次 git 提交时间"，
          # 需要**完整历史**。默认是浅克隆（depth=1），历史被截断，
          # `git log -1 -- <file>` 只能查到 HEAD 那一次 —— 查出来的值
          # 看起来像提交时间、其实是 checkout 时间，比原来的 birthtime 更糟。
          # 详见 eleventy.config.js 里 lastCommitTime 的注释。
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # ⚠️ 从 20 升到 22，两个原因都不是"追新"：
          #   ① **Node 20 已于 2026-04-30 结束支持（EOL）**，
          #      还在用它跑部署，等于把发布管线建在不再收安全更新的运行时上。
          #   ② **Node 20 上全局 WebSocket 默认不开**（要 --experimental-websocket），
          #      而 build 链里的多档溢出门禁（scripts/check-overflow.cjs）
          #      要用 CDP over WebSocket —— 在 Node 20 上会直接抛
          #      "WebSocket is not defined"。该全局 22.0.0 起免旗标、22.4.0 起转正。
          #      （package.json 的 engines 也同步收到 ">=22"。）
          node-version: 22
          cache: npm

      # 记录 runner 镜像里的浏览器版本。
      # 多档溢出门禁要真实浏览器；若哪天 runner 镜像不再自带 Chrome，
      # build 会在那个门禁上**明确报错**（不静默跳过），
      # 有了这行版本号就能一眼看出是镜像变了还是别的什么变了。
      # （该门禁现在一次跑 7 档宽度：360 / 390 / 640 / 768 / 820 / 1024 / 1440，
      #  每档都要重新设一次视口再量，所以比只测一档慢不少。）
      - name: Record runner toolchain
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          node --version
          (google-chrome --version || chromium --version || echo "no chrome found in PATH")

      - name: Install dependencies
        # ⚠️ **CI 必须从 npm 官方源取包**（D106）。
        # 为什么：package-lock.json 里 **130 条 resolved 全部**指向
        # registry.npmmirror.com（本机为了境内速度用的镜像）⇒ 不改这一条，
        # **GitHub 的 runner 就是去第三方镜像取包** —— 镜像不可用 / 被限速时
        # 站点就发不出去（把发布管线架在别人的可用性上）。
        # 怎么改的：`replace-registry-host=always` 让 npm 把锁文件里 resolved
        # 的**主机**换成配置的 registry（npm ≥ 8.3 支持）⇒ 取包主机变了，
        # 但**内容一字不变**（integrity 哈希还是锁文件里那份，校验照旧）。
        # 本地开发不受影响（仍走镜像；锁文件本身一个字节都没改）。
        run: npm ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_REPLACE_REGISTRY_HOST: always

      - name: Build (Eleventy → _site/)
        run: npm run build

      # ⚠️ 门禁接线门禁（check:gates）必须**显式**跑一次，不能只靠 build 链。
      #
      # 为什么：build 链里已经含 `npm run check:gates`，看起来是接上了。
      # 但那正是这个门禁的**自指盲区**——如果有人把 check:gates 从 build 链里
      # 摘掉，那么 build 不会再调用它，而"它没被调用"这件事**没有任何门禁
      # 能发现**：不跑的门禁不会报错，build 照样 exit 0，部署照样发出去。
      # （14:36 场次实测：摘掉后完整 build exit 0、无人报错。）
      # CI 显式调它，它就会看到自己不在 build 链上（GW3）并判红。
      - name: Check that every gate is wired into the build
        run: npm run check:gates

      # 清理 macOS Finder 自动生成的 ._* 资源叉备份（与本地 dev 一致）
      - name: Strip macOS resource forks from _site/
        run: find _site -name '._*' -type f -delete || true

      # ⚠️ 产物里**绝对不能**有 CNAME 文件。
      # 站点部署在**用户站仓库** oldsixxiaolv.github.io（本仓库），内容铺在域名
      # 根 `/`。自定义域名 github.lvyihang.xyz 是在本仓库的
      # Settings → Pages → Custom domain 里配的，不靠 CNAME 文件。
      # 如果产物里再放一份 CNAME，GitHub 会把同一个自定义域名判给两个站点并
      # 报错——官方文档写明：
      #   "If you get an error about a custom domain being taken, you may need
      #    to remove the custom domain from another repository."
      #   (Managing a custom domain for your GitHub Pages site)
      # 这里做成硬断言：万一以后有人往 src/ 里塞了 CNAME，构建立刻失败，
      # 而不是安静地把部署搞挂。
      - name: Assert no CNAME in artifact
        run: |
          if [ -e _site/CNAME ]; then
            echo "::error::_site/CNAME 不应存在：域名已在 Settings → Pages 配好，产物再带 CNAME 会造成域名占用冲突"
            exit 1
          fi

      # 没有 enablement: true —— 官方 action.yml 写明该选项
      # "requires a token other than GITHUB_TOKEN"，用默认 token 无效。
      # 开启 Pages 是一次性的手动操作：Settings → Pages → Source → GitHub Actions。
      # 本仓库是用户站仓库，base_path 应为 /（站点在域名根，无子路径）。
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 部署 job 也要有上限（deploy-pages 内部会轮询部署状态，重试带退避）。
    timeout-minutes: 15
    # 执行部署的 job 才需要这两个权限（官方 deploy-pages 文档写明"至少需要"），
    # 其余 job 一律不给（D100）。
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # 线上部署核查（scripts/check-live-site.cjs）—— 这道门禁**不能**接进 build 链：
  # build 跑在 deploy 之前，那时线上还是上一次部署，把它放进 build 等于每次都对着
  # 旧站点判红，把"部署还没发生"误报成"代码坏了"（豁免理由见
  # scripts/check-gates-wired.cjs 的 EXEMPT）。它属于**部署之后**。
  #
  # ⚠️ 登记豁免的代价是"没人跑 = 没人知道"，所以这里必须是**真的会自动跑**的那一处。
  #   比较基准取**刚部署上去的那份产物**（github-pages artifact），而不是本地重跑一遍
  #   —— 比"发出去的字节"与"在线上的字节"才是这道门禁真正要守的不变式。
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    # 核查 job 同样要上限：它要**等这次部署的内容在 CDN 上生效**（最多 600s
    # = 实测的 cache-control: max-age=600）再跑核查门禁。
    # 20 分钟 = 600s 等待 + checkout/setup-node/下载产物/门禁本身的余量。
    timeout-minutes: 20
    # 只读代码、只读线上站点 ⇒ 不需要任何写权限（D100）。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Download the artifact that was just deployed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: github-pages
          path: _site

      # 下载结果的目录层级必须对，否则后面会拿空目录当"期望值"，门禁会假绿。
      - name: Assert the deployed artifact landed at _site/
        run: |
          if [ ! -f _site/index.html ]; then
            echo "::error::_site/index.html 不存在 —— 下载到的部署产物层级不对，核查门禁会拿空目录当期望值（假绿）"
            exit 1
          fi

      # 部署完到域名真正生效有一段传播延迟（Pages 走 CDN 边缘节点）。
      # ⚠️ **等的是「这一次部署的内容」，不是「站点有响应」**（D124）。
      #   原先这一步只探测 HTTP 状态码 ⇒ **旧部署也返回 200** ⇒ 循环第 1 次探测
      #   就退出 ⇒ 它**根本没等到新版本生效** ⇒ 核查门禁拿**旧内容**与**新产物**
      #   逐项比（L1 路由 / L2 canonical / L4 sitemap 路径集 / L6 feed）⇒
      #   **一次完全健康的部署可能让 CI 变红**（假红）。
      #   假红的代价不是"多报一次"，而是**训练人忽略 CI** ⇒ 整条门禁链失去价值。
      #
      # 怎么判「新版本已生效」：**比构建标记，不比状态码**。
      #   产物 `_site/robots.txt` 有一行 `# generated-at: <ISO>` ——
      #   每次构建都不同（eleventy.config.js 的 buildStamp filter 在构建那一刻生成）
      #   ⇒ 线上 robots.txt 的这一行与产物一致 ⇒ **线上跑的就是这次部署的内容**。
      #   ⚠️ 旧部署的 robots.txt 用的是**旧标签**（`# 生成时间：`）⇒ 取不到标记 ⇒
      #      不等于产物 ⇒ 继续等（**这就是它能认出旧版本的原因**）。
      #
      # ⚠️ **等待预算为什么是 600 秒**（先量再改）：
      #   实测线上响应头 `cache-control: max-age=600`（2026-10-29 场次）⇒
      #   CDN 最长可能把**旧内容**留 10 分钟；而**查询串与 `Cache-Control: no-cache`
      #   都绕不过它**（实测 age 继续上涨 ⇒ 仍是同一份缓存副本）⇒ 只能等。
      #   ⇒ 预算取满这个 TTL（600s）⇒ 预算耗尽还没切过去，那就不是「再等等」的
      #     问题，而是**这次部署真的没生效** ⇒ 判红退出（不得静默继续：
      #     静默继续 ⇒ 旧站点的路由与 canonical 恰好一致时，核查门禁会**全绿**
      #     ⇒ 「这次部署没生效」变成假绿）。
      - name: Wait until the deployed build is live
        run: |
          url=$(node -e "console.log(require('./src/_data/site.js').url)")
          want=$(sed -n 's/^# generated-at: //p' _site/robots.txt | head -n 1 || true)
          if [ -z "$want" ]; then
            echo "::error::产物 _site/robots.txt 里没有 '# generated-at:' 标记 —— 判不出线上是不是这次部署的内容（判据锚点丢了）"
            exit 1
          fi
          deadline=$(( $(date +%s) + 600 ))
          attempt=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            got=$(curl -s --max-time 15 "$url/robots.txt" | sed -n 's/^# generated-at: //p' | head -n 1 || true)
            if [ -n "$got" ] && [ "$got" = "$want" ]; then
              echo "线上已在跑这次部署的内容（构建标记 $want，第 $attempt 次探测）"
              exit 0
            fi
            echo "第 $attempt 次探测：线上构建标记「${got:-取不到}」≠ 本次部署「$want」，等 15s 再试"
            sleep 15
          done
          echo "::error::线上在 600s 内没有切到这次部署的内容（线上构建标记「${got:-取不到}」/ 本次部署「$want」）—— 要么这次部署没生效，要么 CDN 还在发旧版（实测 cache-control: max-age=600，且查询串与 no-cache 请求头都绕不过它）"
          exit 1

      - name: Check the live site against the deployed artifact
        run: node scripts/check-live-site.cjs

# ============================================================================
# action 版本钉法（D100）
# ============================================================================
#
# 上面 6 个 action 全部 **pin 到 commit SHA**，行尾注释里写明它对应的 tag。
#
# 为什么不用 `@v4` 这种 tag：
#   tag 是**可移动的引用** —— 谁改了上游 tag，指向的代码就变了，
#   而**你不会收到任何通知**。对一条「把产物发到公网域名」的管线来说，
#   这正是最不该有的形状：发布出去的字节由一个第三方仓库的 tag 决定，
#   而不是由本仓库的提交决定。钉到 SHA 之后，**这段 YAML 里写下的字节
#   就是会跑的字节**；要升级就走一次有记录的提交（PR 里能看清 diff）。
#
# 怎么升级（别手抄，本轮每个 SHA 都是这样取出来的）：
#   gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'
#   → 把返回的 40 位 SHA 写进 `uses:`，行尾注释写成 `# <tag>`
#   → **顺手确认一下这条 commit 的日期**（同一命令加 `--jq '.commit.committer.date'`），
#     免得 pin 到一个比当前 tag 还老的提交上。
#
# 当前钉住的版本（2026-10-27 实测取自 GitHub API，tag→SHA 另用 `git ls-remote` 复核）：
#   actions/checkout             @3d3c42e5…  v7（2026-07-17）
#   actions/setup-node           @949feb24…  v7（2026-10-08）
#   actions/configure-pages      @45bfe019…  v6（2026-03-24）
#   actions/upload-pages-artifact@fc324d35…  v5（2026-04-08）
#   actions/deploy-pages         @368f8252…  v5（2026-09-01）
#   actions/download-artifact    @9000827c…  v8（2026-10-07）
#
# ⚠️ 为什么这 6 个必须停在**当前大版本**而不是"能跑就行"（D103）：
#   action 的执行**运行时**写在它自己的 action.yml 里（`runs.using`），
#   **不是**由本仓库决定 ⇒ 用老版本 = 把发布管线建在老运行时上。
#   Node 20 已于 **2026-04-30 结束支持（EOL）**（Node 官方 Release 日历：
#   https://github.com/nodejs/Release/blob/main/schedule.json），
#   之后不再收安全更新；Node 22 撑到 2027-04-30，Node 24 撑到 2028-04-30。
#   2026-10-27 实测（逐个拉 action.yml 看 `runs.using`）：
#     checkout             v4=node20  **v5 起=node24**
#     setup-node           v4=node20  **v5 起=node24**
#     configure-pages      v5=node20  **v6 起=node24**
#     upload-pages-artifact v3/v4=node20（内层 upload-artifact v4）**v5 起=node24**（内层 v7）
#     deploy-pages         v4=node20  **v5 起=node24**
#     download-artifact    v4/v5/v6=node20  **v7 起=node24**
#   ⇒ **node24 底线表**（低于它就是 node20 ⇒ 判红）：
#     checkout ≥ v5 ／ setup-node ≥ v5 ／ configure-pages ≥ v6 ／
#     upload-pages-artifact ≥ v5 ／ deploy-pages ≥ v5 ／ download-artifact ≥ v7
#   这张底线表由 `scripts/check-deploy-target.cjs` 的 **DP7** 守着
#   （表在门禁源码里，改版本不改表 ⇒ 门禁当场红）。
#
# 升级动作（别手抄）：
#   ① 查 tag → SHA：`git ls-remote --tags https://github.com/<repo> refs/tags/<tag>`
#      （比 REST API 稳，也不吃 API 限流；本轮实测 GitHub API 已限流 403，
#        `git ls-remote` 照常返回）
#   ② **逐个版本实测 `runs.using`**：
#      `curl -s https://raw.githubusercontent.com/<repo>/<sha>/action.yml | grep using:`
#      （composite action 没有 `using:`，要看它内层 `uses:` 指向哪个版本）
#   ③ 核对 input 兼容性：新版本的 `with:` 输入名与默认值是否仍与本仓写法一致
#      （本轮 6 个 target 逐个比对过：`persist-credentials` / `fetch-depth` /
#      `node-version` / `cache` / `name` / `path` / `enablement` 全部保持）
#   ④ 改 `uses:` 的 SHA 与行尾注释的 tag，**并同步改**门禁里的基线表
