name: Deploy MeteoHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# ⚠️ workflow 级 permissions **只留 contents: read**（D100）。
#
# 为什么收窄：`pages: write` 与 `id-token: write` 原先挂在 workflow 级 ⇒
# **每一个 job 都持有**，包括跑完整条 build 链的 build job（它会执行
# `npm ci` 与仓内 100+ 步门禁脚本 = 仓里可被改的代码）。
#   · `id-token: write` 的危害最大：它让那个 job 能**铸造 OIDC JWT**，
#     而 OIDC 令牌正是「以本仓库身份去第三方云（AWS/GCP/Azure）换凭据」
#     的那张凭证 —— 拿到它的 job 可以拿着仓库的身份去别处取密钥。
#   · `pages: write` 让持有者能**创建 Pages 部署**（改线上内容）。
# 官方 deploy-pages 的 action.yml 写明：执行部署的 job **至少**需要
# `pages: write` + `id-token: write` —— 这两个权限本来就只需要在 deploy
# job 上（https://github.com/actions/deploy-pages#deploy-pages）。
#   · build job 只保留 `contents: read` + `pages: read`：
#     `actions/configure-pages` 只调 `repos.getPages`（GET /repos/{o}/{r}/pages）
#     取站点元数据，实测 dist 里的接口只有 GET，没有写操作 ⇒ `pages: read` 足够。
#   · verify-live job 只需要读代码 ⇒ `contents: read`。
permissions:
  contents: read

# 同一 group 只允许一个 deploy 运行，避免并发部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # build job 只读代码 + 读 Pages 站点元数据，不写任何东西（D100）。
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        # ⚠️ pin 到 commit SHA（不是 tag）—— 见文件末尾「action 版本钉法」。
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # ⚠️ 不把 token 留在 .git/config 里（persist-credentials 默认 true ⇒
          # checkout 会把 GITHUB_TOKEN 写进本地 git 配置，仓内任何脚本都能用它）。
          # 本仓的 build 链只用**本地** git 读历史（git log / git rev-parse），
          # 不做任何需要鉴权的远端操作 ⇒ 关掉零影响。
          persist-credentials: false
          # sitemap 的 <lastmod> 取"该页源文件最后一次 git 提交时间"，
          # 需要**完整历史**。默认是浅克隆（depth=1），历史被截断，
          # `git log -1 -- <file>` 只能查到 HEAD 那一次 —— 查出来的值
          # 看起来像提交时间、其实是 checkout 时间，比原来的 birthtime 更糟。
          # 详见 eleventy.config.js 里 lastCommitTime 的注释。
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # ⚠️ 从 20 升到 22，两个原因都不是"追新"：
          #   ① **Node 20 已于 2026-04-30 结束支持（EOL）**，
          #      还在用它跑部署，等于把发布管线建在不再收安全更新的运行时上。
          #   ② **Node 20 上全局 WebSocket 默认不开**（要 --experimental-websocket），
          #      而 build 链里的多档溢出门禁（scripts/check-overflow.cjs）
          #      要用 CDP over WebSocket —— 在 Node 20 上会直接抛
          #      "WebSocket is not defined"。该全局 22.0.0 起免旗标、22.4.0 起转正。
          #      （package.json 的 engines 也同步收到 ">=22"。）
          node-version: 22
          cache: npm

      # 记录 runner 镜像里的浏览器版本。
      # 多档溢出门禁要真实浏览器；若哪天 runner 镜像不再自带 Chrome，
      # build 会在那个门禁上**明确报错**（不静默跳过），
      # 有了这行版本号就能一眼看出是镜像变了还是别的什么变了。
      # （该门禁现在一次跑 7 档宽度：360 / 390 / 640 / 768 / 820 / 1024 / 1440，
      #  每档都要重新设一次视口再量，所以比只测一档慢不少。）
      - name: Record runner toolchain
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          node --version
          (google-chrome --version || chromium --version || echo "no chrome found in PATH")

      - name: Install dependencies
        run: npm ci

      - name: Build (Eleventy → _site/)
        run: npm run build

      # ⚠️ 门禁接线门禁（check:gates）必须**显式**跑一次，不能只靠 build 链。
      #
      # 为什么：build 链里已经含 `npm run check:gates`，看起来是接上了。
      # 但那正是这个门禁的**自指盲区**——如果有人把 check:gates 从 build 链里
      # 摘掉，那么 build 不会再调用它，而"它没被调用"这件事**没有任何门禁
      # 能发现**：不跑的门禁不会报错，build 照样 exit 0，部署照样发出去。
      # （14:36 场次实测：摘掉后完整 build exit 0、无人报错。）
      # CI 显式调它，它就会看到自己不在 build 链上（GW3）并判红。
      - name: Check that every gate is wired into the build
        run: npm run check:gates

      # 清理 macOS Finder 自动生成的 ._* 资源叉备份（与本地 dev 一致）
      - name: Strip macOS resource forks from _site/
        run: find _site -name '._*' -type f -delete || true

      # ⚠️ 产物里**绝对不能**有 CNAME 文件。
      # 站点部署在**用户站仓库** oldsixxiaolv.github.io（本仓库），内容铺在域名
      # 根 `/`。自定义域名 github.lvyihang.xyz 是在本仓库的
      # Settings → Pages → Custom domain 里配的，不靠 CNAME 文件。
      # 如果产物里再放一份 CNAME，GitHub 会把同一个自定义域名判给两个站点并
      # 报错——官方文档写明：
      #   "If you get an error about a custom domain being taken, you may need
      #    to remove the custom domain from another repository."
      #   (Managing a custom domain for your GitHub Pages site)
      # 这里做成硬断言：万一以后有人往 src/ 里塞了 CNAME，构建立刻失败，
      # 而不是安静地把部署搞挂。
      - name: Assert no CNAME in artifact
        run: |
          if [ -e _site/CNAME ]; then
            echo "::error::_site/CNAME 不应存在：域名已在 Settings → Pages 配好，产物再带 CNAME 会造成域名占用冲突"
            exit 1
          fi

      # 没有 enablement: true —— 官方 action.yml 写明该选项
      # "requires a token other than GITHUB_TOKEN"，用默认 token 无效。
      # 开启 Pages 是一次性的手动操作：Settings → Pages → Source → GitHub Actions。
      # 本仓库是用户站仓库，base_path 应为 /（站点在域名根，无子路径）。
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 执行部署的 job 才需要这两个权限（官方 deploy-pages 文档写明"至少需要"），
    # 其余 job 一律不给（D100）。
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # 线上部署核查（scripts/check-live-site.cjs）—— 这道门禁**不能**接进 build 链：
  # build 跑在 deploy 之前，那时线上还是上一次部署，把它放进 build 等于每次都对着
  # 旧站点判红，把"部署还没发生"误报成"代码坏了"（豁免理由见
  # scripts/check-gates-wired.cjs 的 EXEMPT）。它属于**部署之后**。
  #
  # ⚠️ 登记豁免的代价是"没人跑 = 没人知道"，所以这里必须是**真的会自动跑**的那一处。
  #   比较基准取**刚部署上去的那份产物**（github-pages artifact），而不是本地重跑一遍
  #   —— 比"发出去的字节"与"在线上的字节"才是这道门禁真正要守的不变式。
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    # 只读代码、只读线上站点 ⇒ 不需要任何写权限（D100）。
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download the artifact that was just deployed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: _site

      # 下载结果的目录层级必须对，否则后面会拿空目录当"期望值"，门禁会假绿。
      - name: Assert the deployed artifact landed at _site/
        run: |
          if [ ! -f _site/index.html ]; then
            echo "::error::_site/index.html 不存在 —— 下载到的部署产物层级不对，核查门禁会拿空目录当期望值（假绿）"
            exit 1
          fi

      # 部署完到域名真正生效有一段传播延迟。先等站点起来，再让门禁去判。
      # 这里**不**自己判红：真红不真红由门禁给结论，这一步只负责"别在还没生效时去查"。
      - name: Wait until the site responds
        run: |
          url=$(node -e "console.log(require('./src/_data/site.js').url)")
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/" || true)
            if [ "$code" = "200" ]; then echo "站点已上线（第 $i 次探测，HTTP $code）"; exit 0; fi
            echo "第 $i 次探测 HTTP $code，等 10s 再试"
            sleep 10
          done
          echo "::warning::站点在 120s 内没有正常响应，仍继续跑核查门禁（判红与否由门禁给结论）"

      - name: Check the live site against the deployed artifact
        run: node scripts/check-live-site.cjs

# ============================================================================
# action 版本钉法（D100）
# ============================================================================
#
# 上面 6 个 action 全部 **pin 到 commit SHA**，行尾注释里写明它对应的 tag。
#
# 为什么不用 `@v4` 这种 tag：
#   tag 是**可移动的引用** —— 谁改了上游 tag，指向的代码就变了，
#   而**你不会收到任何通知**。对一条「把产物发到公网域名」的管线来说，
#   这正是最不该有的形状：发布出去的字节由一个第三方仓库的 tag 决定，
#   而不是由本仓库的提交决定。钉到 SHA 之后，**这段 YAML 里写下的字节
#   就是会跑的字节**；要升级就走一次有记录的提交（PR 里能看清 diff）。
#
# 怎么升级（别手抄，本轮每个 SHA 都是这样取出来的）：
#   gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'
#   → 把返回的 40 位 SHA 写进 `uses:`，行尾注释写成 `# <tag>`
#   → **顺手确认一下这条 commit 的日期**（同一命令加 `--jq '.commit.committer.date'`），
#     免得 pin 到一个比当前 tag 还老的提交上。
#
# 当前钉住的版本（2026-10-26 实测取自 GitHub API）：
#   actions/checkout             @11d5960a…  v4（2026-07-16）
#   actions/setup-node           @49933ea5…  v4（2025-04-02）
#   actions/configure-pages      @983d7736…  v5（2024-03-30）
#   actions/upload-pages-artifact@56afc609…  v3（2024-02-07）
#   actions/deploy-pages         @d6db9016…  v4（2024-03-15）
#   actions/download-artifact    @d3f86a10…  v4（2025-04-24）
#
# ⚠️ 诚实边界：SHA 钉住**不等于**这些版本没有已知漏洞 —— 它只保证
#   「跑的就是这一份代码」。上游若发布了安全修复，要按上面的流程升上去。
