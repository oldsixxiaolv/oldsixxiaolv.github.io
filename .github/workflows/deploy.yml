name: Deploy MeteoHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同一 group 只允许一个 deploy 运行，避免并发部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Eleventy → _site/)
        run: npm run build

      # 清理 macOS Finder 自动生成的 ._* 资源叉备份（与本地 dev 一致）
      - name: Strip macOS resource forks from _site/
        run: find _site -name '._*' -type f -delete || true

      # 复制仓库根的 CNAME 到 _site/（声明式、便于自文档化）
      # ⚠️ 但要知道：**CNAME 文件本身不会设置自定义域名**。官方文档明确写着
      #    "A CNAME file in your repository file does not automatically add or
      #    remove a custom domain. Instead, you must configure the custom domain
      #    through your repository settings or through the API."
      #    真正起作用的机制是：用户主页仓库 oldsixxiaolv.github.io 已配
      #    CNAME = github.lvyihang.xyz，**项目站自动继承**该域名并挂在
      #    /MeteoHub/ 下（见 About custom domains → Using a custom domain
      #    across multiple repositories）。
      #    这里的 cp 只是把这个事实写进产物，行为上不依赖它。
      - name: Copy CNAME into _site/
        run: |
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      # 没有 enablement: true —— 官方 action.yml 写明该选项
      # "requires a token other than GITHUB_TOKEN"，用默认 token 无效。
      # 开启 Pages 是一次性的手动操作：Settings → Pages → Source → GitHub Actions。
      # configure-pages 的 base_path 输出会告诉我们实际的挂载路径，
      # 正常应为 /MeteoHub——与 eleventy.config.js 的 pathPrefix 一致。
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4