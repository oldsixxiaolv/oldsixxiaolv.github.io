name: Deploy MeteoHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同一 group 只允许一个 deploy 运行，避免并发部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Eleventy → _site/)
        run: npm run build

      # 清理 macOS Finder 自动生成的 ._* 资源叉备份（与本地 dev 一致）
      - name: Strip macOS resource forks from _site/
        run: find _site -name '._*' -type f -delete || true

      # ⚠️ 产物里**绝对不能**有 CNAME 文件。
      # 本项目是**项目站**（oldsixxiaolv.github.io 下的 /MeteoHub/），
      # 域名 github.lvyihang.xyz 由**用户站** oldsixxiaolv.github.io 持有，
      # 项目站自动继承。一个自定义域名只能属于一个站点——若产物里再放一份
      # CNAME，官方文档写明会报域名被占用：
      #   "If you get an error about a custom domain being taken, you may need
      #    to remove the custom domain from another repository."
      #   (Managing a custom domain for your GitHub Pages site)
      # 站点根由 Settings → Pages 的 Custom domain 字段决定，不靠 CNAME 文件；
      # 用户站那边配好后，项目站无需任何 CNAME 即可挂在 /MeteoHub/。
      # 这里做成硬断言：万一以后有人往 src/ 里塞了 CNAME，构建立刻失败，
      # 而不是安静地把线上域名搞挂。
      - name: Assert no CNAME in artifact
        run: |
          if [ -e _site/CNAME ]; then
            echo "::error::_site/CNAME 不应存在：项目站继承用户站域名，自带 CNAME 会造成域名占用冲突"
            exit 1
          fi

      # 没有 enablement: true —— 官方 action.yml 写明该选项
      # "requires a token other than GITHUB_TOKEN"，用默认 token 无效。
      # 开启 Pages 是一次性的手动操作：Settings → Pages → Source → GitHub Actions。
      # configure-pages 的 base_path 输出会告诉我们实际的挂载路径，
      # 正常应为 /MeteoHub——与 eleventy.config.js 的 pathPrefix 一致。
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4